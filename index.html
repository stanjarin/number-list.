<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f7f4">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css?v=10a">
</head>
<body>

<section id="noteScreen" class="screen hidden">
  <header class="topbar">
    <button id="notesBack" class="notesBack" type="button">‹ <span>Notes</span></button>
    <div class="dots">•••</div>
  </header>
  <main class="note">
    <div id="dateLine" class="dateLine"></div>
    <h1 id="noteTitle">100 Movies</h1>
    <ol id="noteList"></ol>
  </main>
  <footer class="noteFooter"><span>☷</span><span>⌁</span><span>✎</span></footer>

  <button id="voiceHotspot" class="hotspot voiceHotspot" aria-label="Voice"></button>
  <button id="keypadHotspot" class="hotspot keypadHotspot" aria-label="Manual"></button>

  <div id="keypad" class="keypad hidden">
    <div class="keys">
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button id="keyCancel">×</button><button data-digit="0">0</button><button id="keyBack">⌫</button>
    </div>
  </div>
</section>

<section id="libraryScreen" class="screen">
  <div class="libraryHead">
    <div class="folders">‹ <span>Folders</span></div>
    <div class="more">•••</div>
    <h2>All iCloud</h2>
    <div class="search">⌕ <span>Search</span></div>
  </div>
  <div id="libraryScroller" class="libraryScroller"></div>
  <footer class="libraryFooter">
    <span id="noteCount">1 Note</span>
    <button id="addList" type="button" aria-label="New note">✎</button>
  </footer>
</section>

<section id="editorScreen" class="screen hidden">
  <header class="editorHead">
    <button id="editorCancel" type="button">Cancel</button>
    <strong id="editorHeading">Edit List</strong>
    <button id="editorSave" type="button">Save</button>
  </header>
  <main class="editorBody">
    <label>Title<input id="editTitle" type="text" autocomplete="off"></label>
    <label>Force item<input id="editForce" type="text" autocomplete="off"></label>
    <label>Items — one per line<textarea id="editItems" spellcheck="false"></textarea></label>
    <button id="deleteList" class="deleteButton" type="button">Delete List</button>
    <div class="backupRow">
      <button id="exportLibrary" type="button">Export Library</button>
      <label>Import Library<input id="importLibrary" type="file" accept=".json,application/json"></label>
    </div>
    <p class="storageNote">Stored on this iPhone. Export is the backup.</p>
  </main>
</section>

<div id="selftestResult" class="hidden"></div>

<script src="app.js?v=10a"></script>
</body>
</html>
